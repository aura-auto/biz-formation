<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">What Happens When You Miss an LLC Annual Report?</text>
  <text x="400" y="70" text-anchor="middle" font-size="13" fill="#64748b">Penalty costs and consequences by state</text>
  
  <!-- Bar chart area -->
  <!-- Y-axis labels -->
  <text x="100" y="120" text-anchor="end" font-size="11" fill="#64748b">$600</text>
  <line x1="105" y1="115" x2="740" y2="115" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  <text x="100" y="175" text-anchor="end" font-size="11" fill="#64748b">$400</text>
  <line x1="105" y1="170" x2="740" y2="170" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  <text x="100" y="230" text-anchor="end" font-size="11" fill="#64748b">$200</text>
  <line x1="105" y1="225" x2="740" y2="225" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  <text x="100" y="285" text-anchor="end" font-size="11" fill="#64748b">$0</text>
  <line x1="105" y1="280" x2="740" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Baseline -->
  <line x1="105" y1="280" x2="740" y2="280" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Wyoming: Annual Report $60 (green) + Dissolution (red note) -->
  <rect x="130" y="262" width="90" height="18" fill="#22c55e" rx="3"/>
  <text x="175" y="276" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$60</text>
  <text x="175" y="305" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">Wyoming</text>
  <text x="175" y="320" text-anchor="middle" font-size="9" fill="#64748b">Dissolves after 60 days</text>
  
  <!-- Delaware: Franchise Tax $300 (blue) + $200 late penalty (orange) -->
  <rect x="260" y="193" width="90" height="87" fill="#3b82f6" rx="3"/>
  <text x="305" y="242" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$300</text>
  <rect x="260" y="137" width="90" height="56" fill="#f59e0b" rx="3"/>
  <text x="305" y="170" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">+$200</text>
  <text x="305" y="305" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">Delaware</text>
  <text x="305" y="320" text-anchor="middle" font-size="9" fill="#64748b">+ interest on late tax</text>
  
  <!-- California: Franchise Tax $800 (purple) -->
  <rect x="390" y="50" width="90" height="230" fill="#8b5cf6" rx="3"/>
  <text x="435" y="170" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$800</text>
  <text x="435" y="305" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">California</text>
  <text x="435" y="320" text-anchor="middle" font-size="9" fill="#64748b">+ $200 reinstatement</text>
  
  <!-- Florida: $138.75 (teal) + $400 penalty (red) -->
  <rect x="520" y="241" width="90" height="39" fill="#14b8a6" rx="3"/>
  <text x="565" y="265" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$139</text>
  <rect x="520" y="126" width="90" height="115" fill="#ef4444" rx="3"/>
  <text x="565" y="189" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">+$400</text>
  <text x="565" y="305" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">Florida</text>
  <text x="565" y="320" text-anchor="middle" font-size="9" fill="#64748b">$400 automatic penalty</text>
  
  <!-- Texas: $0 report (green) + forfeiture note -->
  <rect x="650" y="265" width="90" height="15" fill="#22c55e" rx="3"/>
  <text x="695" y="277" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$0</text>
  <text x="695" y="305" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600">Texas</text>
  <text x="695" y="320" text-anchor="middle" font-size="9" fill="#64748b">Forfeiture of rights</text>
  
  <!-- Legend -->
  <rect x="130" y="370" width="14" height="14" fill="#22c55e" rx="2"/>
  <text x="150" y="382" font-size="11" fill="#475569">Annual Report / Tax Fee</text>
  <rect x="320" y="370" width="14" height="14" fill="#ef4444" rx="2"/>
  <text x="340" y="382" font-size="11" fill="#475569">Late Penalty / Forfeiture Cost</text>
  <rect x="540" y="370" width="14" height="14" fill="#f59e0b" rx="2"/>
  <text x="560" y="382" font-size="11" fill="#475569">Additional Penalty</text>
  
  <!-- Source note -->
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#94a3b8">Sources: Wyoming SOS (sos.wyo.gov), Florida Division of Corporations (dos.fl.gov),</text>
  <text x="400" y="435" text-anchor="middle" font-size="10" fill="#94a3b8">Texas Comptroller (comptroller.texas.gov), LLC University, state statutes</text>
  <text x="400" y="465" text-anchor="middle" font-size="10" fill="#94a3b8">Note: Reinstatement fees vary. Florida dissolution + reinstatement = ~$239 total (cheaper than $400 late penalty).</text>
  
</svg>