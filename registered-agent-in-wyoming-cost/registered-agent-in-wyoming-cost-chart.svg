<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="340" fill="#f8fafc" rx="12"/>
  <text x="350" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Wyoming Registered Agent: Annual Cost Comparison</text>
  <text x="350" y="55" text-anchor="middle" font-size="12" fill="#64748b">Cost per year (USD)</text>

  <!-- Grid lines -->
  <line x1="160" y1="80" x2="160" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="280" y1="80" x2="280" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="400" y1="80" x2="400" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="520" y1="80" x2="520" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="640" y1="80" x2="640" y2="280" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="160" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">$0</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">$75</text>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">$150</text>
  <text x="520" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">$225</text>
  <text x="640" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">$300</text>

  <!-- Bar 1: Self-Appointed ($0) -->
  <text x="15" y="115" font-size="13" font-weight="600" fill="#1e293b">Self-Appointed</text>
  <text x="15" y="130" font-size="11" fill="#64748b">WY address required</text>
  <rect x="160" y="98" width="4" height="32" fill="#10b981" rx="3"/>
  <text x="170" y="120" font-size="13" font-weight="700" fill="#10b981">$0/yr</text>

  <!-- Bar 2: Northwest ($125) -->
  <text x="15" y="175" font-size="13" font-weight="600" fill="#1e293b">Northwest RA</text>
  <text x="15" y="190" font-size="11" fill="#64748b">Standalone service</text>
  <rect x="160" y="158" width="230" height="32" fill="#3b82f6" rx="3"/>
  <text x="398" y="180" font-size="13" font-weight="700" fill="#3b82f6">~$125/yr</text>

  <!-- Bar 3: doola ($297) -->
  <text x="15" y="235" font-size="13" font-weight="600" fill="#1e293b">doola Starter</text>
  <text x="15" y="250" font-size="11" fill="#64748b">RA + formation + EIN</text>
  <rect x="160" y="218" width="475" height="32" fill="#8b5cf6" rx="3"/>
  <text x="642" y="240" font-size="13" font-weight="700" fill="#8b5cf6">$297/yr</text>

  <!-- Footer -->
  <text x="350" y="330" text-anchor="middle" font-size="10" fill="#94a3b8">Prices verified Aug 2026. Northwest ~$125/yr via LLC University. doola $297/yr from doola.com/pricing.</text>
</svg>
