<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="560" height="340" fill="url(#bg)" rx="8"/>
  <text x="280" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1e293b">LLC Formation Services: Legitimacy Comparison</text>

  <!-- Y axis labels -->
  <text x="50" y="75" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="end">Years</text>
  <text x="50" y="165" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="end">Customers</text>
  <text x="50" y="255" font-family="system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="end">Starter $/yr</text>

  <!-- Legend -->
  <rect x="120" y="310" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="136" y="321" font-family="system-ui,sans-serif" font-size="11" fill="#334155">doola (2020)</text>
  <rect x="240" y="310" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="256" y="321" font-family="system-ui,sans-serif" font-size="11" fill="#334155">LegalZoom (2001)</text>
  <rect x="370" y="310" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="386" y="321" font-family="system-ui,sans-serif" font-size="11" fill="#334155">ZenBusiness (2015)</text>
  <rect x="120" y="328" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="136" y="339" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Northwest (1998)</text>

  <!-- Years in business row -->
  <!-- doola ~5 yrs -->
  <rect x="60" y="58" width="30" height="24" rx="4" fill="#3b82f6"/>
  <text x="75" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">5</text>
  <!-- LegalZoom ~24 yrs -->
  <rect x="100" y="58" width="144" height="24" rx="4" fill="#10b981"/>
  <text x="172" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">24</text>
  <!-- ZenBusiness ~10 yrs -->
  <rect x="250" y="58" width="60" height="24" rx="4" fill="#f59e0b"/>
  <text x="280" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">10</text>
  <!-- Northwest ~27 yrs -->
  <rect x="320" y="58" width="162" height="24" rx="4" fill="#8b5cf6"/>
  <text x="401" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">27</text>

  <!-- Customers row -->
  <!-- doola 22k -->
  <rect x="60" y="148" width="15" height="24" rx="4" fill="#3b82f6"/>
  <text x="80" y="164" font-family="system-ui,sans-serif" font-size="10" fill="#334155">22K+</text>
  <!-- LegalZoom ~10M+ (too large to show, cap at 400px) -->
  <rect x="100" y="148" width="350" height="24" rx="4" fill="#10b981"/>
  <text x="275" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">10M+</text>
  <!-- ZenBusiness 950K -->
  <rect x="250" y="148" width="33" height="24" rx="4" fill="#f59e0b"/>
  <text x="290" y="164" font-family="system-ui,sans-serif" font-size="10" fill="#334155">950K+</text>
  <!-- Northwest not disclosed -->
  <rect x="320" y="148" width="10" height="24" rx="4" fill="#8b5cf6"/>
  <text x="335" y="164" font-family="system-ui,sans-serif" font-size="10" fill="#334155">N/A</text>

  <!-- Starter price row (lower = better) -->
  <!-- doola $297 -->
  <rect x="60" y="238" width="297" height="24" rx="4" fill="#3b82f6"/>
  <text x="208" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">$297</text>
  <!-- LegalZoom $0 (base) + state fees, up to $299+ -->
  <rect x="100" y="238" width="5" height="24" rx="4" fill="#10b981"/>
  <text x="110" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#334155">$0*</text>
  <!-- ZenBusiness $0 + state fees -->
  <rect x="250" y="238" width="5" height="24" rx="4" fill="#f59e0b"/>
  <text x="260" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#334155">$0*</text>
  <!-- Northwest $39 + state -->
  <rect x="320" y="238" width="39" height="24" rx="4" fill="#8b5cf6"/>
  <text x="364" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#334155">$39*</text>

  <!-- Footnote -->
  <text x="60" y="300" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">* = + state filing fees. doola price is annual. Others may charge separately for add-ons (EIN, registered agent, compliance).</text>
</svg>