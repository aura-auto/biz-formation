<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Montana LLC Formation Timeline</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#64748b">Online filing only — Montana does not accept mail filings</text>

  <!-- Standard row -->
  <rect x="40" y="90" width="640" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="90" width="8" height="60" rx="4" fill="#3b82f6"/>
  <text x="68" y="116" font-size="14" font-weight="600" fill="#1e293b">Standard Online Filing</text>
  <text x="68" y="136" font-size="12" fill="#64748b">$35 state fee | No extra charge</text>
  <text x="500" y="126" font-size="16" font-weight="700" fill="#3b82f6">5-6 business days</text>

  <!-- Priority row -->
  <rect x="40" y="162" width="640" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="162" width="8" height="60" rx="4" fill="#f59e0b"/>
  <text x="68" y="188" font-size="14" font-weight="600" fill="#1e293b">Priority Processing</text>
  <text x="68" y="208" font-size="12" fill="#64748b">$35 + $20 expedite = $55 total</text>
  <text x="500" y="198" font-size="16" font-weight="700" fill="#f59e0b">24 hours</text>

  <!-- Expedited row -->
  <rect x="40" y="234" width="640" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="234" width="8" height="60" rx="4" fill="#ef4444"/>
  <text x="68" y="260" font-size="14" font-weight="600" fill="#1e293b">Expedited Processing</text>
  <text x="68" y="280" font-size="12" fill="#64748b">$35 + $100 expedite = $135 total</text>
  <text x="500" y="270" font-size="16" font-weight="700" fill="#ef4444">1 hour</text>

  <!-- Footer -->
  <text x="360" y="312" text-anchor="middle" font-size="11" fill="#94a3b8">Source: Montana Secretary of State (sos.mt.gov) | LLC University (llcuniversity.com) | Last updated 2026-08-23</text>
</svg>