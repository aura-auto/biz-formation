<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <style>
    .bar { rx: 4; }
    .label { font-family: system-ui, sans-serif; font-size: 13px; fill: #333; }
    .amount { font-family: system-ui, sans-serif; font-size: 12px; fill: #555; font-weight: 600; }
    .title { font-family: system-ui, sans-serif; font-size: 15px; fill: #111; font-weight: 700; }
    .subtitle { font-family: system-ui, sans-serif; font-size: 11px; fill: #888; }
    .axis { stroke: #ccc; stroke-width: 1; }
    .grid { stroke: #eee; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <rect width="720" height="340" fill="white" rx="8"/>
  <text x="24" y="30" class="title">Year-1 Total Cost (Formation + EIN + Registered Agent)</text>
  <text x="24" y="48" class="subtitle">State fees excluded. Based on official vendor pricing, August 2026.</text>

  <!-- Grid lines -->
  <line x1="160" y1="70" x2="160" y2="290" class="grid"/>
  <line x1="260" y1="70" x2="260" y2="290" class="grid"/>
  <line x1="360" y1="70" x2="360" y2="290" class="grid"/>
  <line x1="460" y1="70" x2="460" y2="290" class="grid"/>
  <line x1="560" y1="70" x2="560" y2="290" class="grid"/>
  <line x1="660" y1="70" x2="660" y2="290" class="grid"/>

  <!-- Axis labels -->
  <text x="160" y="308" class="amount" text-anchor="middle">$0</text>
  <text x="260" y="308" class="amount" text-anchor="middle">$100</text>
  <text x="360" y="308" class="amount" text-anchor="middle">$200</text>
  <text x="460" y="308" class="amount" text-anchor="middle">$300</text>
  <text x="560" y="308" class="amount" text-anchor="middle">$400</text>
  <text x="660" y="308" class="amount" text-anchor="middle">$500</text>

  <!-- Axis line -->
  <line x1="150" y1="290" x2="680" y2="290" class="axis"/>

  <!-- doola: $297/yr recurring -->
  <text x="145" y="88" class="label" text-anchor="end">doola</text>
  <rect x="160" y="74" width="297" height="28" class="bar" fill="#6366f1"/>
  <text x="465" y="93" class="amount">$297/yr recurring</text>

  <!-- Firstbase: $399 one-time -->
  <text x="145" y="133" class="label" text-anchor="end">Firstbase</text>
  <rect x="160" y="119" width="399" height="28" class="bar" fill="#22c55e"/>
  <text x="567" y="138" class="amount">$399 one-time</text>

  <!-- Northwest: $39 + $200 EIN = ~$239 -->
  <text x="145" y="178" class="label" text-anchor="end">Northwest</text>
  <rect x="160" y="164" width="239" height="28" class="bar" fill="#f59e0b"/>
  <text x="407" y="183" class="amount">~$239 one-time</text>

  <!-- ZenBusiness: $99 add-on for EIN -->
  <text x="145" y="223" class="label" text-anchor="end">ZenBusiness</text>
  <rect x="160" y="209" width="99" height="28" class="bar" fill="#06b6d4"/>
  <text x="267" y="228" class="amount">~$99 one-time</text>

  <!-- LegalZoom: $249 RA -->
  <text x="145" y="268" class="label" text-anchor="end">LegalZoom</text>
  <rect x="160" y="254" width="249" height="28" class="bar" fill="#8b5cf6"/>
  <text x="417" y="273" class="amount">~$249 + RA $249/yr</text>

  <!-- Legend note -->
  <text x="24" y="330" class="subtitle">EIN cost shown where non-SSN applicants pay separately. Northwest $39 formation + $200 EIN; ZenBusiness $0 formation + $99 EIN; LegalZoom $0 formation + RA $249/yr.</text>
</svg>
