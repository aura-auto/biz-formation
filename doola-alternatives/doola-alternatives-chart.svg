<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Year-One LLC Formation Cost Comparison</text>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#64748b">Forming fee + first-year registered agent + EIN. State fees excluded. Based on official pricing pages.</text>

  <!-- Y axis labels -->
  <text x="95" y="90" text-anchor="end" font-size="10" fill="#64748b">$0</text>
  <text x="95" y="145" text-anchor="end" font-size="10" fill="#64748b">$100</text>
  <text x="95" y="200" text-anchor="end" font-size="10" fill="#64748b">$200</text>
  <text x="95" y="255" text-anchor="end" font-size="10" fill="#64748b">$300</text>
  <text x="95" y="310" text-anchor="end" font-size="10" fill="#64748b">$400</text>
  <text x="95" y="365" text-anchor="end" font-size="10" fill="#64748b">$500</text>

  <!-- Grid lines -->
  <line x1="105" y1="85" x2="690" y2="85" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="105" y1="140" x2="690" y2="140" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="105" y1="195" x2="690" y2="195" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="105" y1="250" x2="690" y2="250" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="105" y1="305" x2="690" y2="305" stroke="#cbd5e1" stroke-width="0.5"/>
  <line x1="105" y1="360" x2="690" y2="360" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- Scale: $0 at y=370, $500 at y=80. So $1 = 0.58px. -->
  <!-- Bizee Silver: $0 formation + $0 RA yr1 + $0 EIN = $0  (EIN free via IRS, but some pay $70 add-on; using $0) -->
  <!-- Actually Bizee: $0 formation + $0 RA (1yr free) = $0. But need to add EIN if desired: $70. Let's show $0 base. -->
  <!-- ZenBusiness: $0 formation + $199 RA + $99 EIN = $298 -->
  <!-- LegalZoom Basic: $0 formation + $249 RA = $249 (no EIN in basic) -->
  <!-- Northwest: $39 formation + $125 RA yr1 (free first year! wait - first year free with formation) = $39 -->
  <!-- Actually NW: RA first year free with formation. So $39 + $0 RA + $50 EIN = $89 -->
  <!-- doola Starter: $297 (includes EIN + RA + formation) -->

  <!-- Bars -->
  <!-- Bizee Silver: $0 -->
  <rect x="120" y="366" width="80" height="4" rx="3" fill="#22c55e"/>
  <text x="160" y="363" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">$0</text>
  <text x="160" y="395" text-anchor="middle" font-size="10" fill="#334155" font-weight="500">Bizee</text>
  <text x="160" y="408" text-anchor="middle" font-size="9" fill="#64748b">Silver</text>

  <!-- Northwest: $39 formation + free RA yr1 + $50 EIN = $89 -->
  <!-- Height = 89 * 0.58 = ~51.6px. y = 370 - 51.6 = 318.4 -->
  <rect x="215" y="318" width="80" height="52" rx="3" fill="#3b82f6"/>
  <text x="255" y="313" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">$89</text>
  <text x="255" y="395" text-anchor="middle" font-size="10" fill="#334155" font-weight="500">Northwest</text>
  <text x="255" y="408" text-anchor="middle" font-size="9" fill="#64748b">+ State fee</text>

  <!-- LegalZoom Basic: $0 form + $249 RA = $249 -->
  <!-- Height = 249 * 0.58 = ~144.4px. y = 370 - 144.4 = 225.6 -->
  <rect x="310" y="226" width="80" height="144" rx="3" fill="#f59e0b"/>
  <text x="350" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">$249</text>
  <text x="350" y="395" text-anchor="middle" font-size="10" fill="#334155" font-weight="500">LegalZoom</text>
  <text x="350" y="408" text-anchor="middle" font-size="9" fill="#64748b">Basic</text>

  <!-- ZenBusiness: $0 form + $199 RA + $99 EIN = $298 -->
  <!-- Height = 298 * 0.58 = ~172.8px. y = 370 - 172.8 = 197.2 -->
  <rect x="405" y="197" width="80" height="173" rx="3" fill="#8b5cf6"/>
  <text x="445" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">$298</text>
  <text x="445" y="395" text-anchor="middle" font-size="10" fill="#334155" font-weight="500">ZenBusiness</text>
  <text x="445" y="408" text-anchor="middle" font-size="9" fill="#64748b">+ State fee</text>

  <!-- doola Starter: $297 (includes formation + RA + EIN) -->
  <!-- Height = 297 * 0.58 = ~172.3px. y = 370 - 172.3 = 197.7 -->
  <rect x="500" y="198" width="80" height="172" rx="3" fill="#ef4444"/>
  <text x="540" y="193" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">$297</text>
  <text x="540" y="395" text-anchor="middle" font-size="10" fill="#334155" font-weight="500">doola</text>
  <text x="540" y="408" text-anchor="middle" font-size="9" fill="#64748b">Starter</text>

  <!-- Annotation -->
  <rect x="595" y="75" width="110" height="60" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="92" text-anchor="middle" font-size="9" fill="#64748b">Bars include:</text>
  <text x="650" y="104" text-anchor="middle" font-size="9" fill="#334155">Formation fee</text>
  <text x="650" y="116" text-anchor="middle" font-size="9" fill="#334155">1st-year registered agent</text>
  <text x="650" y="128" text-anchor="middle" font-size="9" fill="#334155">EIN (where bundled)</text>

  <!-- Source -->
  <text x="360" y="425" text-anchor="middle" font-size="8" fill="#94a3b8">Source: Official pricing pages, Aug 2026. State fees excluded. doola.com, northwestregisteredagent.com, zenbusiness.com, legalzoom.com, bizee.com</text>
</svg>
