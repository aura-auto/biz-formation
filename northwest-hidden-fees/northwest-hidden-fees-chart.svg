<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="url(#bg)" rx="12"/>
  <text x="360" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Northwest vs. Competitors: 3-Year Total Cost</text>
  <text x="360" y="58" text-anchor="middle" fill="#94a3b8" font-size="11">Formation + Registered Agent + EIN. State filing fees excluded. Source: official vendor pages, Aug 2026.</text>

  <!-- Y-axis labels -->
  <text x="78" y="110" text-anchor="end" fill="#94a3b8" font-size="11">$900</text>
  <text x="78" y="175" text-anchor="end" fill="#94a3b8" font-size="11">$700</text>
  <text x="78" y="240" text-anchor="end" fill="#94a3b8" font-size="11">$500</text>
  <text x="78" y="305" text-anchor="end" fill="#94a3b8" font-size="11">$300</text>
  <text x="78" y="370" text-anchor="end" fill="#94a3b8" font-size="11">$100</text>

  <!-- Grid lines -->
  <line x1="85" y1="105" x2="680" y2="105" stroke="#334155" stroke-width="1"/>
  <line x1="85" y1="170" x2="680" y2="170" stroke="#334155" stroke-width="1"/>
  <line x1="85" y1="235" x2="680" y2="235" stroke="#334155" stroke-width="1"/>
  <line x1="85" y1="300" x2="680" y2="300" stroke="#334155" stroke-width="1"/>
  <line x1="85" y1="365" x2="680" y2="365" stroke="#334155" stroke-width="1"/>

  <!-- Northwest: $289 (3yr: $39 + $125 + $125) + $50 EIN = $339. Bar height: (339/900)*265 = ~99px from baseline 370 -->
  <rect x="105" y="271" width="80" height="99" rx="4" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="145" y="265" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">$339</text>
  <text x="145" y="398" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">Northwest</text>

  <!-- ZenBusiness: $0 + $199/yr × 2 = $398 + $99 EIN = $497. Height: (497/900)*265 = ~147px -->
  <rect x="225" y="223" width="80" height="147" rx="4" fill="#a78bfa" filter="url(#shadow)"/>
  <text x="265" y="217" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">$497</text>
  <text x="265" y="398" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">ZenBusiness</text>

  <!-- LegalZoom: $0 + $249/yr × 2 = $498 + $99 EIN = $597. Height: (597/900)*265 = ~176px -->
  <rect x="345" y="194" width="80" height="176" rx="4" fill="#f472b6" filter="url(#shadow)"/>
  <text x="385" y="188" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="700">$597</text>
  <text x="385" y="398" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">LegalZoom</text>

  <!-- doola Starter: $297 × 3 = $891. Height: (891/900)*265 = ~262px -->
  <rect x="465" y="108" width="80" height="262" rx="4" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="505" y="102" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">$891</text>
  <text x="505" y="398" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">doola</text>
  <text x="505" y="412" text-anchor="middle" fill="#94a3b8" font-size="9">(Starter)</text>

  <!-- Firstbase: $399 one-time + $299 RA × 2 = $997. Height: (997/900)*265 = ~293px but cap at 265 -->
  <rect x="585" y="105" width="80" height="265" rx="4" fill="#10b981" filter="url(#shadow)"/>
  <text x="625" y="99" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">$997</text>
  <text x="625" y="398" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">Firstbase</text>
</svg>
