<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="340" fill="#fafbfc" rx="8"/>
  <text x="350" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Grace Period After Registered Agent Resignation (days)</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#666">Time your business has to appoint a replacement before penalties begin</text>

  <!-- Bars -->
  <!-- Texas: 31 days -->
  <rect x="160" y="72" width="310" height="38" fill="#3b82f6" rx="4"/>
  <text x="155" y="96" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Texas</text>
  <text x="476" y="96" font-size="13" fill="#333">31 days</text>

  <!-- Delaware: 30 days -->
  <rect x="160" y="120" width="300" height="38" fill="#6366f1" rx="4"/>
  <text x="155" y="144" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Delaware</text>
  <text x="466" y="144" font-size="13" fill="#333">30 days</text>

  <!-- California: 30 days -->
  <rect x="160" y="168" width="300" height="38" fill="#8b5cf6" rx="4"/>
  <text x="155" y="192" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">California</text>
  <text x="466" y="192" font-size="13" fill="#333">30 days</text>

  <!-- Wyoming: 30 days -->
  <rect x="160" y="216" width="300" height="38" fill="#a78bfa" rx="4"/>
  <text x="155" y="240" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Wyoming</text>
  <text x="466" y="240" font-size="13" fill="#333">30 days</text>

  <!-- Florida: no explicit grace -->
  <rect x="160" y="264" width="30" height="38" fill="#ef4444" rx="4"/>
  <text x="155" y="288" text-anchor="end" font-size="13" font-weight="600" fill="#1a1a2e">Florida</text>
  <text x="196" y="288" font-size="13" fill="#333">No statutory grace period</text>

  <!-- Axis lines -->
  <line x1="160" y1="310" x2="470" y2="310" stroke="#ccc" stroke-width="1"/>
  <text x="160" y="325" font-size="10" fill="#999">0</text>
  <text x="210" y="325" font-size="10" fill="#999">10</text>
  <text x="260" y="325" font-size="10" fill="#999">20</text>
  <text x="310" y="325" font-size="10" fill="#999">30</text>
  <text x="360" y="325" font-size="10" fill="#999">40</text>
  <text x="410" y="325" font-size="10" fill="#999">50</text>
  <text x="460" y="325" font-size="10" fill="#999">60</text>

  <!-- Source -->
  <text x="350" y="340" text-anchor="middle" font-size="9" fill="#999">Source: State Secretary of State statutes, August 2026</text>
</svg>
