<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fff" rx="8"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Year 1 LLC Formation Cost Comparison (Service Fee Only)</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#666">State fees excluded; based on official pricing pages as of August 2026</text>
  
  <!-- Y axis -->
  <line x1="80" y1="65" x2="80" y2="350" stroke="#ccc" stroke-width="1"/>
  
  <!-- X axis -->
  <line x1="80" y1="350" x2="680" y2="350" stroke="#ccc" stroke-width="1"/>
  
  <!-- Grid lines -->
  <line x1="80" y1="100" x2="680" y2="100" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="175" x2="680" y2="175" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="250" x2="680" y2="250" stroke="#eee" stroke-width="1"/>
  
  <!-- Y axis labels -->
  <text x="75" y="355" text-anchor="end" font-size="10" fill="#666">$0</text>
  <text x="75" y="255" text-anchor="end" font-size="10" fill="#666">$100</text>
  <text x="75" y="180" text-anchor="end" font-size="10" fill="#666">$200</text>
  <text x="75" y="105" text-anchor="end" font-size="10" fill="#666">$300</text>
  <text x="75" y="70" text-anchor="end" font-size="10" fill="#666">$340</text>
  
  <!-- Bars - scale: 350px = $0, 70px per $100, so y = 350 - (value/100)*70 -->
  <!-- Bizee: $0 (Silver) -->
  <rect x="100" y="350" width="70" height="0" fill="#6366f1" rx="3"/>
  <text x="135" y="367" text-anchor="middle" font-size="10" fill="#333">$0</text>
  
  <!-- ZenBusiness: $0 (Starter) -->
  <rect x="190" y="350" width="70" height="0" fill="#8b5cf6" rx="3"/>
  <text x="225" y="367" text-anchor="middle" font-size="10" fill="#333">$0</text>
  
  <!-- LegalZoom: $0 (Basic) -->
  <rect x="280" y="350" width="70" height="0" fill="#a78bfa" rx="3"/>
  <text x="315" y="367" text-anchor="middle" font-size="10" fill="#333">$0</text>
  
  <!-- Northwest: $39 -->
  <rect x="370" y="322.7" width="70" height="27.3" fill="#f59e0b" rx="3"/>
  <text x="405" y="319" text-anchor="middle" font-size="10" fill="#333">$39</text>
  
  <!-- Firstbase: ~$199 (standalone Start) -->
  <rect x="460" y="210.7" width="70" height="139.3" fill="#10b981" rx="3"/>
  <text x="495" y="207" text-anchor="middle" font-size="10" fill="#333">$199</text>
  
  <!-- doola: $297 -->
  <rect x="550" y="142.1" width="70" height="207.9" fill="#ef4444" rx="3"/>
  <text x="585" y="139" text-anchor="middle" font-size="10" fill="#333">$297</text>
  
  <!-- X axis labels -->
  <text x="135" y="390" text-anchor="middle" font-size="10" fill="#555">Bizee</text>
  <text x="225" y="390" text-anchor="middle" font-size="10" fill="#555">ZenBusiness</text>
  <text x="315" y="390" text-anchor="middle" font-size="10" fill="#555">LegalZoom</text>
  <text x="405" y="390" text-anchor="middle" font-size="10" fill="#555">Northwest</text>
  <text x="495" y="390" text-anchor="middle" font-size="10" fill="#555">Firstbase</text>
  <text x="585" y="390" text-anchor="middle" font-size="10" fill="#555">doola</text>
  
  <!-- Legend note -->
  <text x="350" y="398" text-anchor="middle" font-size="9" fill="#999">Note: Year 2 registered agent fees not shown. NW renews at $125/yr; Bizee at $119/yr; ZenBusiness at $199/yr; LegalZoom at $249/yr.</text>
</svg>