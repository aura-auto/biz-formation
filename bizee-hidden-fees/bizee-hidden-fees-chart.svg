<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" role="img" aria-label="Bizee vs doola cost comparison">
<rect width="640" height="360" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111">Two-year cost: Bizee vs doola ($100 state fee)</text>
<text x="60" y="70" font-family="sans-serif" font-size="13" fill="#111">Bizee Basic Y1: $100</text>
<rect x="280" y="52" width="90" height="26" fill="#2e7d32"/>
<text x="60" y="110" font-family="sans-serif" font-size="13" fill="#111">Bizee Basic Y1+Y2: ~$250+</text>
<rect x="280" y="92" width="225" height="26" fill="#66bb6a"/>
<text x="60" y="150" font-family="sans-serif" font-size="13" fill="#111">Bizee Standard 2yr: ~$450+</text>
<rect x="280" y="132" width="400" height="26" fill="#ffa000"/>
<text x="60" y="190" font-family="sans-serif" font-size="13" fill="#111">doola Starter 2yr: ~$594+</text>
<rect x="280" y="172" width="300" height="26" fill="#1565c0"/>
<text x="280" y="220" font-family="sans-serif" font-size="12" fill="#555">Bars include state filing fee; Bizee Y2 adds $149 agent renewal.</text>
<text x="280" y="240" font-family="sans-serif" font-size="12" fill="#555">State annual fees vary; planning figures, Sept 2026.</text>
<rect x="60" y="260" width="14" height="14" fill="#2e7d32"/><text x="80" y="272" font-family="sans-serif" font-size="12" fill="#111">Bizee Basic</text>
<rect x="200" y="260" width="14" height="14" fill="#ffa000"/><text x="220" y="272" font-family="sans-serif" font-size="12" fill="#111">Bizee Standard</text>
<rect x="360" y="260" width="14" height="14" fill="#1565c0"/><text x="380" y="272" font-family="sans-serif" font-size="12" fill="#111">doola Starter</text>
</svg>
