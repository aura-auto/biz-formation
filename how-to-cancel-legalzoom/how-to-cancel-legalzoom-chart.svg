<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="700" height="380" fill="url(#bg)" rx="8"/>
  
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Registered Agent Annual Cost Comparison</text>
  <text x="350" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Ongoing yearly fees. Formation costs excluded. August 2026.</text>
  
  <!-- Grid lines -->
  <line x1="120" y1="80" x2="120" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="310" x2="660" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Y-axis labels -->
  <text x="110" y="314" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$0</text>
  <line x1="115" y1="252" x2="660" y2="252" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="256" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$100</text>
  <line x1="115" y1="194" x2="660" y2="194" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="198" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$150</text>
  <line x1="115" y1="136" x2="660" y2="136" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="140" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$200</text>
  <line x1="115" y1="92" x2="660" y2="92" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="110" y="96" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$250</text>
  
  <!-- Bars: scale $0-$250 maps to y 310-80, so $1 = 0.92px -->
  <!-- Northwest: $125 -->
  <rect x="160" y="195" width="100" height="115" fill="#3b82f6" rx="4"/>
  <text x="210" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af">$125</text>
  
  <!-- ZenBusiness: $199 -->
  <rect x="300" y="127" width="100" height="183" fill="#8b5cf6" rx="4"/>
  <text x="350" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6d28d9">$199</text>
  
  <!-- LegalZoom: $249 -->
  <rect x="440" y="81" width="100" height="229" fill="#ef4444" rx="4"/>
  <text x="490" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">$249</text>
  
  <!-- doola (included in $297 plan): highlight -->
  <rect x="580" y="81" width="60" height="229" fill="#10b981" rx="4" opacity="0.3"/>
  <text x="610" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#065f46" transform="rotate(-90, 610, 175)">Included in $297/yr plan</text>
  
  <!-- X-axis labels -->
  <text x="210" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Northwest</text>
  <text x="350" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">ZenBusiness</text>
  <text x="490" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">LegalZoom</text>
  <text x="610" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">doola</text>
  
  <!-- Legend -->
  <rect x="160" y="355" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="178" y="366" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Standalone RA</text>
  <rect x="310" y="355" width="12" height="12" fill="#10b981" rx="2"/>
  <text x="328" y="366" font-family="system-ui, sans-serif" font-size="11" fill="#475569">RA bundled in plan</text>
</svg>