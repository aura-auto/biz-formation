<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="700" height="520" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">EIN Reference Number 114: Responsible Party Fix Flow</text>

  <!-- Step 1: Pull IRS Records -->
  <rect x="30" y="60" width="190" height="90" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="30" y="60" width="190" height="28" rx="10" fill="#dc2626"/>
  <rect x="30" y="78" width="190" height="10" fill="#dc2626"/>
  <text x="125" y="79" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">STEP 1</text>
  <text x="125" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Pull Your CP575</text>
  <text x="125" y="122" text-anchor="middle" font-size="11" fill="#64748b">Check IRS records via</text>
  <text x="125" y="137" text-anchor="middle" font-size="11" fill="#64748b">BTA or Letter 147C</text>

  <!-- Arrow 1->2 -->
  <line x1="220" y1="105" x2="260" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Compare -->
  <rect x="260" y="60" width="190" height="90" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="260" y="60" width="190" height="28" rx="10" fill="#f59e0b"/>
  <rect x="260" y="78" width="190" height="10" fill="#f59e0b"/>
  <text x="355" y="79" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">STEP 2</text>
  <text x="355" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Compare Records</text>
  <text x="355" y="122" text-anchor="middle" font-size="11" fill="#64748b">Check entity type, name,</text>
  <text x="355" y="137" text-anchor="middle" font-size="11" fill="#64748b">and responsible party info</text>

  <!-- Arrow 2->3 -->
  <line x1="450" y1="105" x2="490" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Identify mismatch -->
  <rect x="490" y="60" width="190" height="90" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="490" y="60" width="190" height="28" rx="10" fill="#2563eb"/>
  <rect x="490" y="78" width="190" height="10" fill="#2563eb"/>
  <text x="585" y="79" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">STEP 3</text>
  <text x="585" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Identify Problem</text>
  <text x="585" y="122" text-anchor="middle" font-size="11" fill="#64748b">Name, SSN, entity type,</text>
  <text x="585" y="137" text-anchor="middle" font-size="11" fill="#64748b">or responsible party?</text>

  <!-- Branch boxes -->
  <!-- Entity type wrong -->
  <rect x="30" y="180" width="200" height="80" rx="10" fill="#fff" filter="url(#shadow)" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="30" y="180" width="200" height="24" rx="10" fill="#dc2626"/>
  <rect x="30" y="196" width="200" height="8" fill="#dc2626"/>
  <text x="130" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ENTITY TYPE WRONG</text>
  <text x="130" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Apply for new EIN</text>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#64748b">with correct entity type</text>

  <!-- Arrow to entity type -->
  <line x1="355" y1="150" x2="130" y2="180" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Name/SSN mismatch -->
  <rect x="250" y="180" width="200" height="80" rx="10" fill="#fff" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="250" y="180" width="200" height="24" rx="10" fill="#f59e0b"/>
  <rect x="250" y="196" width="200" height="8" fill="#f59e0b"/>
  <text x="350" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">NAME / SSN MISMATCH</text>
  <text x="350" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Reapply with correct info</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#64748b">or file Form 8822-B</text>

  <!-- Arrow to name/SSN -->
  <line x1="440" y1="150" x2="350" y2="180" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Responsible party issue -->
  <rect x="470" y="180" width="200" height="80" rx="10" fill="#fff" filter="url(#shadow)" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="470" y="180" width="200" height="24" rx="10" fill="#2563eb"/>
  <rect x="470" y="196" width="200" height="8" fill="#2563eb"/>
  <text x="570" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">RESPONSIBLE PARTY</text>
  <text x="570" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">File Form 8822-B</text>
  <text x="570" y="240" text-anchor="middle" font-size="11" fill="#64748b">correct within 60 days</text>

  <!-- Arrow to responsible party -->
  <line x1="570" y1="150" x2="570" y2="180" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Resolution boxes -->
  <!-- New EIN path -->
  <rect x="30" y="290" width="200" height="70" rx="10" fill="#f0fdf4" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Apply online at IRS.gov</text>
  <text x="130" y="333" text-anchor="middle" font-size="11" fill="#64748b">Instant EIN if approved</text>
  <text x="130" y="348" text-anchor="middle" font-size="11" fill="#64748b">or fax SS-4: 4 business days</text>

  <line x1="130" y1="260" x2="130" y2="290" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Reapply path -->
  <rect x="250" y="290" width="200" height="70" rx="10" fill="#f0fdf4" filter="url(#shadow)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Reapply online or fax</text>
  <text x="350" y="333" text-anchor="middle" font-size="11" fill="#64748b">Same-day if online</text>
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#64748b">4 days by fax, 4 weeks by mail</text>

  <line x1="350" y1="260" x2="350" y2="290" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Form 8822-B path -->
  <rect x="470" y="290" width="200" height="70" rx="10" fill="#fef3c7" filter="url(#shadow)" stroke="#d97706" stroke-width="1.5"/>
  <text x="570" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Mail Form 8822-B</text>
  <text x="570" y="333" text-anchor="middle" font-size="11" fill="#64748b">Allow up to 60 days</text>
  <text x="570" y="348" text-anchor="middle" font-size="11" fill="#64748b">for IRS processing</text>

  <line x1="570" y1="260" x2="570" y2="290" stroke="#d97706" stroke-width="1.5"/>

  <!-- Success boxes -->
  <rect x="30" y="385" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">EIN issued</text>
  <line x1="130" y1="360" x2="130" y2="385" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="250" y="385" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="350" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">EIN issued</text>
  <line x1="350" y1="360" x2="350" y2="385" stroke="#16a34a" stroke-width="1.5"/>

  <rect x="470" y="385" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="570" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Records updated</text>
  <line x1="570" y1="360" x2="570" y2="385" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Key note box -->
  <rect x="80" y="445" width="540" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="350" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Do not keep retrying online without fixing the underlying issue</text>
  <text x="350" y="488" text-anchor="middle" font-size="11" fill="#991b1b">Reference Number 114 will keep appearing until the responsible party mismatch is corrected.</text>

  <!-- Source -->
  <text x="350" y="515" text-anchor="middle" font-size="10" fill="#94a3b8">Sources: IRS.gov employer-identification-number; IRS Form 8822-B; IRS Publication 1635</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
