<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">First-year formation cost for Firstbase alternatives</title>
  <desc id="desc">Bar chart comparing the first-year formation and registered agent service fee for doola, Firstbase, Northwest, ZenBusiness, and LegalZoom, based on official published pricing as of August 2026.</desc>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#222">Year-one formation + registered agent fee, 2026</text>
  <text x="320" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">State filing fees excluded. All prices from official vendor pages, Aug 19 2026.</text>

  <!-- Y axis labels - scale: $0 at y=390, $700 at y=70. $1 = 0.457px -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#555">
    <text x="55" y="394" text-anchor="end">$0</text>
    <text x="55" y="329" text-anchor="end">$150</text>
    <text x="55" y="264" text-anchor="end">$300</text>
    <text x="55" y="199" text-anchor="end">$450</text>
    <text x="55" y="134" text-anchor="end">$600</text>
    <text x="55" y="74" text-anchor="end">$700</text>
  </g>

  <!-- Horizontal gridlines -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="62" y1="390" x2="600" y2="390"/>
    <line x1="62" y1="322" x2="600" y2="322"/>
    <line x1="62" y1="254" x2="600" y2="254"/>
    <line x1="62" y1="186" x2="600" y2="186"/>
    <line x1="62" y1="118" x2="600" y2="118"/>
    <line x1="62" y1="70" x2="600" y2="70"/>
  </g>

  <!-- Scale: $1 = 0.457px. Baseline y=390. $700 = 320px from baseline. -->
  <!-- doola $297 -> 136px -->
  <rect x="80" y="254" width="85" height="136" rx="4" fill="#2f6fed"/>
  <text x="122" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2f6fed" font-weight="bold">$297</text>
  <text x="122" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#222" font-weight="bold">doola</text>
  <text x="122" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Starter/yr</text>

  <!-- Firstbase $698 -> 319px -->
  <rect x="200" y="71" width="85" height="319" rx="4" fill="#c0392b"/>
  <text x="242" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c0392b" font-weight="bold">$698</text>
  <text x="242" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#222" font-weight="bold">Firstbase</text>
  <text x="242" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Start+RA</text>

  <!-- Northwest $39 -> 18px -->
  <rect x="320" y="372" width="85" height="18" rx="4" fill="#e8851b"/>
  <text x="362" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e8851b" font-weight="bold">$39</text>
  <text x="362" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#222" font-weight="bold">Northwest</text>
  <text x="362" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">+ state fee</text>

  <!-- ZenBusiness $0 -> 0px -->
  <rect x="440" y="390" width="85" height="4" rx="2" fill="#7ac943"/>
  <text x="482" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7ac943" font-weight="bold">$0</text>
  <text x="482" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#222" font-weight="bold">ZenBusiness</text>
  <text x="482" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Starter</text>

  <!-- LegalZoom $249 -> 114px -->
  <rect x="560" y="276" width="85" height="114" rx="4" fill="#8e44ad"/>
  <text x="602" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8e44ad" font-weight="bold">$249</text>
  <text x="602" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#222" font-weight="bold">LegalZoom</text>
  <text x="602" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Pro</text>

  <text x="320" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">Firstbase: Start ($399 one-time) + registered agent ($299/yr). ZenBusiness $0 excludes RA ($199/yr add-on).</text>
</svg>
