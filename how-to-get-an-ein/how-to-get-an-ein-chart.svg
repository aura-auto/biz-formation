<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect width="720" height="560" fill="#FFFFFF"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A202C">IRS Online EIN Application: Am I eligible?</text>

  <rect x="210" y="70" width="300" height="52" rx="8" fill="#EBF4FF" stroke="#3182CE" stroke-width="2"/>
  <text x="360" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B6CB0">Start your application</text>
  <text x="360" y="111" text-anchor="middle" font-size="12" fill="#2B6CB0">You are the responsible party</text>

  <line x1="360" y1="122" x2="360" y2="150" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="150" width="360" height="60" rx="8" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="360" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">Check 1: Place of business</text>
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#4A5568">Is your principal place of business</text>
  <text x="360" y="209" text-anchor="middle" font-size="12" fill="#4A5568">in the U.S. or a U.S. territory?</text>

  <line x1="150" y1="180" x2="90" y2="255" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="128" y="210" font-size="12" fill="#38A169">Yes</text>
  <line x1="570" y1="180" x2="630" y2="255" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="210" font-size="12" fill="#E53E3E">No</text>

  <rect x="15" y="260" width="150" height="58" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5"/>
  <text x="90" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#C53030">Not eligible</text>
  <text x="90" y="302" text-anchor="middle" font-size="11" fill="#C53030">Apply by phone,</text>
  <text x="90" y="316" text-anchor="middle" font-size="11" fill="#C53030">fax, or mail instead</text>

  <rect x="555" y="260" width="150" height="58" rx="8" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5"/>
  <text x="630" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#C53030">Not eligible online</text>
  <text x="630" y="302" text-anchor="middle" font-size="11" fill="#C53030">Use Form SS-4 by</text>
  <text x="630" y="316" text-anchor="middle" font-size="11" fill="#C53030">phone, fax, or mail</text>

  <line x1="360" y1="210" x2="360" y2="255" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="255" width="360" height="60" rx="8" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="360" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">Check 2: Responsible party</text>
  <text x="360" y="299" text-anchor="middle" font-size="12" fill="#4A5568">Do you control the entity, or</text>
  <text x="360" y="314" text-anchor="middle" font-size="12" fill="#4A5568">are you its authorized representative?</text>

  <line x1="360" y1="315" x2="360" y2="355" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="160" y="355" width="400" height="60" rx="8" fill="#F7FAFC" stroke="#A0AEC0" stroke-width="1.5"/>
  <text x="360" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">Check 3: Tax ID</text>
  <text x="360" y="399" text-anchor="middle" font-size="12" fill="#4A5568">Do you have the responsible party's</text>
  <text x="360" y="414" text-anchor="middle" font-size="12" fill="#4A5568">SSN or ITIN? (An EIN won't work here)</text>

  <line x1="360" y1="415" x2="360" y2="450" stroke="#4A5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="450" width="300" height="56" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="2"/>
  <text x="360" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#276749">Eligible: apply for free</text>
  <text x="360" y="494" text-anchor="middle" font-size="12" fill="#276749">IRS issues your EIN immediately on approval</text>

  <text x="360" y="540" text-anchor="middle" font-size="11" fill="#718096">Facts from IRS.gov - Get an Employer Identification Number</text>
</svg>
