<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">How to Fix EIN Reference Number 101</text>

  <!-- Step 1: Start -->
  <rect x="200" y="55" width="280" height="44" rx="22" fill="#dc2626" stroke="none"/>
  <text x="340" y="82" text-anchor="middle" fill="#fff" font-weight="600">You got Reference Number 101</text>
  <line x1="340" y1="99" x2="340" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Decision diamond -->
  <polygon points="340,125 450,175 340,225 230,175" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="172" text-anchor="middle" font-weight="600" fill="#92400e">Name conflict?</text>
  <text x="340" y="187" text-anchor="middle" font-size="11" fill="#92400e">(most likely)</text>

  <!-- YES branch -->
  <line x1="450" y1="175" x2="530" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="168" font-size="11" fill="#16a34a" font-weight="600">Yes</text>

  <!-- NO branch -->
  <line x1="230" y1="175" x2="140" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="168" font-size="11" fill="#dc2626" font-weight="600">No</text>

  <!-- No branch action -->
  <rect x="20" y="150" width="120" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="172" text-anchor="middle" fill="#1e40af" font-weight="600">Check SSN/ITIN</text>
  <text x="80" y="187" text-anchor="middle" fill="#1e40af" font-size="11">for typos</text>

  <!-- Step 3: Download SS-4 -->
  <rect x="545" y="148" width="125" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="607" y="171" text-anchor="middle" fill="#166534" font-weight="600">Download</text>
  <text x="607" y="187" text-anchor="middle" fill="#166534" font-size="11">Form SS-4</text>
  <line x1="607" y1="202" x2="607" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Attach formation docs -->
  <rect x="530" y="240" width="155" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="607" y="262" text-anchor="middle" fill="#166534" font-weight="600">Attach Articles</text>
  <text x="607" y="278" text-anchor="middle" fill="#166534" font-size="11">of Organization</text>
  <line x1="607" y1="294" x2="607" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Fax to IRS -->
  <rect x="490" y="330" width="235" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="607" y="352" text-anchor="middle" fill="#92400e" font-weight="600">Fax to IRS</text>
  <text x="607" y="368" text-anchor="middle" fill="#92400e" font-size="11">855-641-6935 (domestic)</text>
  <line x1="607" y1="384" x2="607" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Wait -->
  <rect x="505" y="420" width="205" height="48" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="607" y="442" text-anchor="middle" fill="#5b21b6" font-weight="600">Wait ~4 business days</text>
  <text x="607" y="457" text-anchor="middle" fill="#5b21b6" font-size="11">EIN returned by fax</text>

  <!-- Alternative: Call IRS box on the left -->
  <rect x="20" y="250" width="200" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="120" y="274" text-anchor="middle" fill="#c2410c" font-weight="600">Optional: Call IRS first</text>
  <text x="120" y="290" text-anchor="middle" fill="#c2410c" font-size="11">800-829-4933</text>
  <text x="120" y="304" text-anchor="middle" fill="#c2410c" font-size="10">(diagnosis only - still fax)</text>

  <!-- Key note box -->
  <rect x="20" y="380" width="340" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="402" text-anchor="middle" fill="#991b1b" font-weight="700" font-size="12">Do NOT keep retrying online</text>
  <text x="190" y="420" text-anchor="middle" fill="#991b1b" font-size="11">Once you get 101, the online tool</text>
  <text x="190" y="436" text-anchor="middle" fill="#991b1b" font-size="11">is closed to your entity. Fax is the fix.</text>

  <!-- Source -->
  <text x="340" y="510" text-anchor="middle" font-size="10" fill="#94a3b8">Sources: IRS.gov EIN page; IRS Form SS-4; IRS Publication 1635</text>
</svg>