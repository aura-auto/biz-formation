<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">doola annual plan prices for US LLC formation</title>
  <desc id="desc">Bar chart of doola's four annual plans: Starter $297, Pulse $300, Tax and Compliance $1999, Business-in-a-Box $2999. State filing fees are separate.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .axis-label { font-size: 12px; fill: #6b7280; }
    .value { font-size: 14px; font-weight: bold; fill: #111827; }
    .bar-label { font-size: 13px; fill: #374151; }
  </style>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">doola annual plan prices (USD, per year)</text>
  <text x="360" y="52" text-anchor="middle" class="axis-label">State filing fees not included</text>

  <!-- Y axis gridlines and labels -->
  <!-- max 3000 -> scale: 3000 = 300px, so 10px per $100 -->
  <g class="axis-label">
    <line x1="80" y1="110" x2="640" y2="110" stroke="#e5e7eb"/>
    <text x="60" y="114" text-anchor="end">$3000</text>
    <line x1="80" y1="210" x2="640" y2="210" stroke="#e5e7eb"/>
    <text x="60" y="214" text-anchor="end">$2000</text>
    <line x1="80" y1="310" x2="640" y2="310" stroke="#e5e7eb"/>
    <text x="60" y="314" text-anchor="end">$1000</text>
    <line x1="80" y1="410" x2="640" y2="410" stroke="#e5e7eb"/>
    <text x="60" y="408" text-anchor="end">$0</text>
  </g>

  <!-- Bars: top at y=410, height = dollars/10 -->
  <!-- Starter $297 -> height 29.7 -->
  <rect x="120" y="380" width="80" height="30" fill="#2563eb"/>
  <text x="160" y="374" text-anchor="middle" class="value">$297</text>
  <text x="160" y="398" text-anchor="middle" class="bar-label">Starter</text>

  <!-- Pulse $300 -> height 30 -->
  <rect x="250" y="380" width="80" height="30" fill="#0ea5e9"/>
  <text x="290" y="374" text-anchor="middle" class="value">$300</text>
  <text x="290" y="398" text-anchor="middle" class="bar-label">Pulse</text>

  <!-- Tax and Compliance $1999 -> height 199.9 -->
  <rect x="380" y="210" width="80" height="200" fill="#6366f1"/>
  <text x="420" y="204" text-anchor="middle" class="value">$1,999</text>
  <text x="420" y="285" text-anchor="middle" class="bar-label" fill="#ffffff">Tax</text>
  <text x="420" y="301" text-anchor="middle" class="bar-label" fill="#ffffff">&amp; Comp</text>

  <!-- Business-in-a-Box $2999 -> height 299.9 -->
  <rect x="510" y="110" width="80" height="300" fill="#8b5cf6"/>
  <text x="550" y="104" text-anchor="middle" class="value">$2,999</text>
  <text x="550" y="160" text-anchor="middle" class="bar-label" fill="#ffffff">Biz-in-a-Box</text>

  <text x="360" y="150" text-anchor="middle" class="bar-label" fill="#6b7280">All plans billed annually</text>
</svg>
