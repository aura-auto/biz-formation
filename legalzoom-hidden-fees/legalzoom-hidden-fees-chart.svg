  <rect x="320" y="290" width="12" height="12" fill="#16a34a" rx="2"/>
  <text x="338" y="301" font-size="10" fill="#475569">doola (transparent pricing)</text>
  <rect x="320" y="310" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="338" y="321" font-size="10" fill="#475569">ZenBusiness</text>

  <!-- Scale -->
  <line x1="60" y1="340" x2="580" y2="340" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="356" font-size="9" fill="#94a3b8">$0</text>
  <text x="190" y="356" font-size="9" fill="#94a3b8">$297</text>
  <text x="375" y="356" font-size="9" fill="#94a3b8">$498</text>
  <text x="560" y="356" font-size="9" fill="#94a3b8">$1,086</text>
