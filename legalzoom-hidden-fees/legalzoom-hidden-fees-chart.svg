  <rect x="60" y="176" width="190" height="36" fill="#16a34a" rx="4"/>
  <text x="260" y="199" font-size="13" font-weight="600" fill="#16a34a">$297</text>
  <text x="60" y="171" font-size="11" fill="#475569">doola Starter (all-inclusive)</text>

  <!-- ZenBusiness -->
  <rect x="60" y="224" width="0" height="36" fill="#2563eb" rx="4"/>
  <rect x="60" y="224" width="316" height="36" fill="#2563eb" rx="4"/>
  <text x="386" y="247" font-size="13" font-weight="600" fill="#2563eb">$497</text>
  <text x="60" y="219" font-size="11" fill="#475569">ZenBusiness Pro (with RA + EIN)</text>

  <!-- Legend -->
  <rect x="60" y="290" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="78" y="301" font-size="10" fill="#475569">LegalZoom (manageable if you cancel)</text>
  <rect x="60" y="310" width="12" height="12" fill="#991b1b" rx="2"/>
