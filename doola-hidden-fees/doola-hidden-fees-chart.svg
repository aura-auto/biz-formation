<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Annual Cost: Formation + Registered Agent</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#666">State fees excluded. Based on official pricing, August 2026.</text>
  
  <!-- Y-axis labels -->
  <text x="50" y="95" text-anchor="end" font-size="10" fill="#666">$0</text>
  <text x="50" y="160" text-anchor="end" font-size="10" fill="#666">$100</text>
  <text x="50" y="225" text-anchor="end" font-size="10" fill="#666">$200</text>
  <text x="50" y="290" text-anchor="end" font-size="10" fill="#666">$300</text>
  
  <!-- Grid lines -->
  <line x1="60" y1="90" x2="560" y2="90" stroke="#eee" stroke-width="1"/>
  <line x1="60" y1="155" x2="560" y2="155" stroke="#eee" stroke-width="1"/>
  <line x1="60" y1="220" x2="560" y2="220" stroke="#eee" stroke-width="1"/>
  <line x1="60" y1="285" x2="560" y2="285" stroke="#eee" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- ZenBusiness: $0 -->
  <rect x="90" y="280" width="80" height="5" rx="3" fill="#22c55e"/>
  <text x="130" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#22c55e">$0</text>
  
  <!-- Bizee: $0 -->
  <rect x="200" y="280" width="80" height="5" rx="3" fill="#3b82f6"/>
  <text x="240" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b82f6">$0</text>
  
  <!-- LegalZoom: $0 -->
  <rect x="310" y="280" width="80" height="5" rx="3" fill="#f59e0b"/>
  <text x="350" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">$0</text>
  
  <!-- Northwest: $39 -->
  <rect x="420" y="260" width="80" height="25" rx="3" fill="#8b5cf6"/>
  <text x="460" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b5cf6">$39</text>
  
  <!-- Doola Starter: $297 -->
  <rect x="90" y="90" width="80" height="195" rx="3" fill="#ef4444"/>
  <text x="130" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">$297</text>
  
  <!-- Doola Starter + Bookkeeping: $597 (off chart, show as text) -->
  <rect x="200" y="90" width="80" height="195" rx="3" fill="#ef4444" opacity="0.6"/>
  <text x="240" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">$597*</text>
  <text x="240" y="72" text-anchor="middle" font-size="9" fill="#999">Starter + Bookkeeping</text>
  
  <!-- X-axis labels -->
  <text x="130" y="310" text-anchor="middle" font-size="10" fill="#333">ZenBusiness</text>
  <text x="130" y="322" text-anchor="middle" font-size="9" fill="#666">Starter</text>
  
  <text x="240" y="310" text-anchor="middle" font-size="10" fill="#333">Bizee</text>
  <text x="240" y="322" text-anchor="middle" font-size="9" fill="#666">Basic</text>
  
  <text x="350" y="310" text-anchor="middle" font-size="10" fill="#333">LegalZoom</text>
  <text x="350" y="322" text-anchor="middle" font-size="9" fill="#666">Basic</text>
  
  <text x="460" y="310" text-anchor="middle" font-size="10" fill="#333">Northwest</text>
  <text x="460" y="322" text-anchor="middle" font-size="9" fill="#666">$39 flat</text>
  
  <!-- Legend -->
  <rect x="60" y="350" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="78" y="360" font-size="10" fill="#333">doola (formation only)</text>
  
  <rect x="220" y="350" width="12" height="12" rx="2" fill="#ef4444" opacity="0.6"/>
  <text x="238" y="360" font-size="10" fill="#333">doola + bookkeeping add-on</text>
  
  <text x="60" y="385" font-size="9" fill="#999">* Bars above $300 are capped for readability. Actual doola + bookkeeping = $597/year.</text>
</svg>