<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="700" height="420" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="350" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">EIN Reference Number 112: Name-Mismatch Fix Flow</text>

  <!-- Step 1 -->
  <rect x="30" y="65" width="190" height="90" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="30" y="65" width="190" height="28" rx="10" fill="#dc2626"/>
  <rect x="30" y="83" width="190" height="10" fill="#dc2626"/>
  <text x="125" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">STEP 1</text>
  <text x="125" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">See Error 112</text>
  <text x="125" y="128" text-anchor="middle" font-size="11" fill="#64748b">Name doesn't match</text>
  <text x="125" y="143" text-anchor="middle" font-size="11" fill="#64748b">state records</text>

  <!-- Arrow 1->2 -->
  <line x1="220" y1="110" x2="260" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <rect x="260" y="65" width="190" height="90" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="260" y="65" width="190" height="28" rx="10" fill="#f59e0b"/>
  <rect x="260" y="83" width="190" height="10" fill="#f59e0b"/>
  <text x="355" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">STEP 2</text>
  <text x="355" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Compare Names</text>
  <text x="355" y="128" text-anchor="middle" font-size="11" fill="#64748b">Check state filing vs.</text>
  <text x="355" y="143" text-anchor="middle" font-size="11" fill="#64748b">EIN application entry</text>

  <!-- Arrow 2->3 -->
  <line x1="450" y1="110" x2="490" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <rect x="490" y="65" width="190" height="90" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="490" y="65" width="190" height="28" rx="10" fill="#16a34a"/>
  <rect x="490" y="83" width="190" height="10" fill="#16a34a"/>
  <text x="585" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">STEP 3</text>
  <text x="585" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Reapply Correctly</text>
  <text x="585" y="128" text-anchor="middle" font-size="11" fill="#64748b">Use exact legal name</text>
  <text x="585" y="143" text-anchor="middle" font-size="11" fill="#64748b">from formation docs</text>

  <!-- Common Causes section -->
  <rect x="30" y="185" width="650" height="210" rx="10" fill="#fff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="350" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Common Causes of Reference Number 112</text>

  <!-- Cause list -->
  <circle cx="60" cy="245" r="14" fill="#fee2e2"/>
  <text x="60" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">1</text>
  <text x="85" y="250" font-size="12" fill="#334155">Entity type differences (LLC vs. L.L.C., Inc vs. Incorporated)</text>

  <circle cx="60" cy="285" r="14" fill="#fef3c7"/>
  <text x="60" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">2</text>
  <text x="85" y="290" font-size="12" fill="#334155">Punctuation stripped or added (apostrophes, periods, commas)</text>

  <circle cx="60" cy="325" r="14" fill="#dbeafe"/>
  <text x="60" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">3</text>
  <text x="85" y="330" font-size="12" fill="#334155">DBA or trade name entered instead of legal entity name</text>

  <circle cx="60" cy="365" r="14" fill="#d1fae5"/>
  <text x="60" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">4</text>
  <text x="85" y="370" font-size="12" fill="#334155">State filing not yet complete when EIN application submitted</text>
</svg>