<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Year-one LLC setup cost: doola vs LegalZoom</title>
  <desc>Bar chart comparing doola Starter at $297/year plus state fees against LegalZoom Basic at $0 plus state fees and Pro at $249 plus state fees, with LegalZoom's national average state filing fee of $130 shown.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .label { font-size: 13px; fill: #222; }
    .big { font-size: 15px; font-weight: bold; fill: #111; }
    .axis { font-size: 12px; fill: #555; }
  </style>
  <rect width="760" height="420" fill="#fafafa" rx="8"/>
  <text x="380" y="34" text-anchor="middle" class="big" fill="#0b3d91">Year-one LLC setup: entry plans (plus state filing fees)</text>

  <!-- gridlines -->
  <line x1="120" y1="80" x2="120" y2="340" stroke="#ccc" stroke-width="1"/>
  <line x1="120" y1="340" x2="680" y2="340" stroke="#999" stroke-width="2"/>

  <!-- LegalZoom Basic $0+ fees -->
  <rect x="150" y="340" width="80" height="0" fill="#5aa469"/>
  <text x="190" y="360" text-anchor="middle" class="big">$0</text>

  <!-- LegalZoom Pro $249 -->
  <rect x="270" y="221" width="80" height="119" fill="#5aa469"/>
  <text x="310" y="340" text-anchor="middle" class="label">$249 + fees</text>

  <!-- doola Starter $297 -->
  <rect x="400" y="199" width="80" height="141" fill="#ca4a2f"/>
  <text x="440" y="340" text-anchor="middle" class="label">$297/yr</text>

  <!-- x labels -->
  <text x="190" y="385" text-anchor="middle" class="axis">LegalZoom</text>
  <text x="190" y="400" text-anchor="middle" class="axis">Basic</text>
  <text x="310" y="385" text-anchor="middle" class="axis">LegalZoom</text>
  <text x="310" y="400" text-anchor="middle" class="axis">Pro</text>
  <text x="440" y="385" text-anchor="middle" class="axis">doola</text>
  <text x="440" y="400" text-anchor="middle" class="axis">Starter</text>

  <!-- y axis scale -->
  <text x="112" y="344" text-anchor="end" class="axis">$0</text>
  <text x="112" y="221" text-anchor="end" class="axis">$250</text>
  <text x="112" y="104" text-anchor="end" class="axis">$500</text>
  <line x1="120" y1="221" x2="126" y2="221" stroke="#ccc" stroke-width="1"/>

  <!-- filing fee note -->
  <text x="380" y="300" text-anchor="middle" class="label" fill="#555">doola Starter includes EIN + US business address.</text>
  <text x="380" y="318" text-anchor="middle" class="label" fill="#555">LegalZoom Pro adds operating agreement, EIN, attorney consults.</text>
  <text x="380" y="336" text-anchor="middle" class="label" fill="#888">LegalZoom puts the national average state filing fee at $130.</text>
  <text x="380" y="370" text-anchor="middle" class="label" fill="#888">All prices billed yearly. State fees vary by state on top of both.</text>
</svg>
