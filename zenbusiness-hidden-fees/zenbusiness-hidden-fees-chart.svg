<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="420" fill="url(#bg)" rx="12"/>
  
  <text x="350" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">ZenBusiness vs. doola: Real Year-1 Cost</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#64748b">State fees excluded. Based on official pricing pages (Aug 2026).</text>

  <!-- Bars -->
  <!-- ZenBusiness Starter: $398 - $497 (mid ~$448) -->
  <rect x="120" y="90" width="280" height="50" rx="6" fill="#f97316" opacity="0.9"/>
  <text x="110" y="120" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">ZenBusiness Starter</text>
  <text x="410" y="120" font-size="13" font-weight="bold" fill="#f97316">$398 - $497</text>

  <!-- ZenBusiness Pro: $497 - $596 (mid ~$547) -->
  <rect x="120" y="150" width="350" height="50" rx="6" fill="#ea580c" opacity="0.85"/>
  <text x="110" y="180" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">ZenBusiness Pro</text>
  <text x="480" y="180" font-size="13" font-weight="bold" fill="#ea580c">$497 - $596</text>

  <!-- ZenBusiness Premium: $597 - $676 (mid ~$637) -->
  <rect x="120" y="210" width="420" height="50" rx="6" fill="#dc2626" opacity="0.8"/>
  <text x="110" y="240" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">ZenBusiness Premium</text>
  <text x="550" y="240" font-size="13" font-weight="bold" fill="#dc2626">$597 - $676</text>

  <!-- doola Starter: $297 -->
  <rect x="120" y="280" width="190" height="50" rx="6" fill="#2563eb" opacity="0.9"/>
  <text x="110" y="310" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">doola Starter</text>
  <text x="320" y="310" font-size="14" font-weight="bold" fill="#2563eb">$297</text>

  <!-- Savings annotation -->
  <line x1="310" y1="285" x2="310" y2="135" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="310" y="355" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">Up to $379 less than ZenBusiness Premium</text>

  <!-- Legend -->
  <rect x="120" y="380" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="138" y="391" font-size="11" fill="#475569">doola (all-in: formation + EIN + RA + address)</text>
  <rect x="400" y="380" width="12" height="12" rx="2" fill="#f97316"/>
  <text x="418" y="391" font-size="11" fill="#475569">ZenBusiness (formation + EIN + RA + compliance)</text>
</svg>
