<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="Arial, sans-serif">
<rect width="640" height="340" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Firstbase: headline vs realistic year-one cost</text>
<text x="320" y="48" text-anchor="middle" font-size="12" fill="#666">Source: firstbase.io pricing; doola.com/pricing. As of 2026-09-02.</text>
<g font-size="13" fill="#1a1a1a">
<text x="20" y="110">$399 headline (Start only)</text>
<rect x="250" y="92" width="110" height="28" fill="#9ecae1"/>
<text x="365" y="111" font-size="12" fill="#333">$399</text>
<text x="20" y="160">Lean realistic (Start + Agent)</text>
<rect x="250" y="142" width="192" height="28" fill="#e6550d"/>
<text x="447" y="161" font-size="12" fill="#333">$698</text>
<text x="20" y="210">Non-US basics (+ Mailroom)</text>
<rect x="250" y="192" width="278" height="28" fill="#e6550d"/>
<text x="533" y="211" font-size="12" fill="#333">~$1,013</text>
<text x="20" y="260">doola Starter (comparison)</text>
<rect x="250" y="242" width="82" height="28" fill="#31a354"/>
<text x="337" y="261" font-size="12" fill="#333">$297/yr</text>
</g>
<text x="20" y="310" font-size="11" fill="#666">Firstbase Start $399 one-time; Agent Autopilot $299/yr required; Mailroom Basic ~$35/mo. State taxes extra.</text>
