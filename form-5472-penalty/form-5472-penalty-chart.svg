<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 1.5; rx: 6; }
      .box-red { fill: #fff0f0; stroke: #c92a2a; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #f0fff4; stroke: #2b8a3e; stroke-width: 1.5; rx: 6; }
      .box-blue { fill: #e7f5ff; stroke: #1971c2; stroke-width: 1.5; rx: 6; }
      .box-amber { fill: #fff9db; stroke: #e67700; stroke-width: 1.5; rx: 6; }
      .text { font-size: 13px; fill: #212529; }
      .text-sm { font-size: 11px; fill: #495057; }
      .text-bold { font-size: 13px; fill: #212529; font-weight: bold; }
      .text-title { font-size: 16px; fill: #212529; font-weight: bold; }
      .text-red { font-size: 14px; fill: #c92a2a; font-weight: bold; }
      .text-green { font-size: 13px; fill: #2b8a3e; font-weight: bold; }
      .arrow { stroke: #868e96; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #c92a2a; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-green { stroke: #2b8a3e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#868e96"/></marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c92a2a"/></marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2b8a3e"/></marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="text-title">Form 5472 Penalty Decision Tree</text>

  <!-- Step 1: Ownership check -->
  <rect x="225" y="50" width="250" height="50" class="box-blue"/>
  <text x="350" y="72" text-anchor="middle" class="text-bold">Is your LLC 25%+ foreign owned?</text>
  <text x="350" y="88" text-anchor="middle" class="text-sm">(Non-US citizen/resident owns 25%+ of LLC)</text>

  <!-- Arrow down from Step 1 -->
  <line x1="350" y1="100" x2="350" y2="130" class="arrow"/>

  <!-- Step 2: Reportable transaction check -->
  <rect x="200" y="130" width="300" height="50" class="box-blue"/>
  <text x="350" y="152" text-anchor="middle" class="text-bold">Any reportable transactions?</text>
  <text x="350" y="168" text-anchor="middle" class="text-sm">Sales, rents, fees, loans, distributions with related parties</text>

  <!-- Left branch: No -->
  <line x1="200" y1="155" x2="120" y2="155" class="arrow-green"/>
  <rect x="30" y="135" width="90" height="40" class="box-green"/>
  <text x="75" y="155" text-anchor="middle" class="text-green">No filing</text>
  <text x="75" y="168" text-anchor="middle" class="text-sm">(no obligation)</text>

  <!-- Right branch: Yes -->
  <line x1="500" y1="155" x2="560" y2="155" class="arrow-red"/>
  <rect x="560" y="135" width="120" height="40" class="box-amber"/>
  <text x="620" y="155" text-anchor="middle" class="text-bold">Yes = Must File</text>
  <text x="620" y="168" text-anchor="middle" class="text-sm">Form 5472 + pro forma 1120</text>

  <!-- Arrow down from Yes -->
  <line x1="620" y1="175" x2="620" y2="210" class="arrow"/>

  <!-- Step 3: Did you file? -->
  <rect x="520" y="210" width="200" height="50" class="box"/>
  <text x="620" y="232" text-anchor="middle" class="text-bold">Did you file on time?</text>
  <text x="620" y="248" text-anchor="middle" class="text-sm">Due date = Form 1120 due date</text>

  <!-- Left: Yes, filed -->
  <line x1="520" y1="235" x2="440" y2="235" class="arrow-green"/>
  <rect x="350" y="215" width="90" height="40" class="box-green"/>
  <text x="395" y="235" text-anchor="middle" class="text-green">Filed OK</text>
  <text x="395" y="248" text-anchor="middle" class="text-sm">Keep records</text>

  <!-- Right: No -->
  <line x1="620" y1="260" x2="620" y2="295" class="arrow-red"/>
  <rect x="510" y="295" width="220" height="55" class="box-red"/>
  <text x="620" y="315" text-anchor="middle" class="text-red">$25,000 penalty</text>
  <text x="620" y="335" text-anchor="middle" class="text-sm">Per form, per reporting corporation</text>

  <!-- Arrow down from penalty -->
  <line x1="620" y1="350" x2="620" y2="385" class="arrow-red"/>

  <!-- Step 4: Did you respond to IRS notice? -->
  <rect x="510" y="385" width="220" height="50" class="box"/>
  <text x="620" y="407" text-anchor="middle" class="text-bold">IRS sent notice?</text>
  <text x="620" y="422" text-anchor="middle" class="text-sm">90 days to respond</text>

  <!-- Left: responded -->
  <line x1="510" y1="410" x2="440" y2="410" class="arrow-green"/>
  <rect x="350" y="390" width="90" height="40" class="box-green"/>
  <text x="395" y="410" text-anchor="middle" class="text-green">Responded</text>
  <text x="395" y="423" text-anchor="middle" class="text-sm">File + fix</text>

  <!-- Right: didn't respond -->
  <line x1="620" y1="435" x2="620" y2="470" class="arrow-red"/>
  <rect x="490" y="470" width="260" height="70" class="box-red"/>
  <text x="620" y="490" text-anchor="middle" class="text-red">+$25,000 per related party</text>
  <text x="620" y="508" text-anchor="middle" class="text-sm">Per 30-day period of continued failure</text>
  <text x="620" y="528" text-anchor="middle" class="text-sm">Criminal penalties also possible</text>

  <!-- Bottom: Total exposure -->
  <rect x="140" y="560" width="420" height="45" class="box-red"/>
  <text x="350" y="580" text-anchor="middle" class="text-red">Total penalty exposure can quickly exceed $75,000+</text>
  <text x="350" y="596" text-anchor="middle" class="text-sm">$25K initial + $25K continuation per related party per 30-day period</text>

  <!-- Source -->
  <text x="350" y="618" text-anchor="middle" class="text-sm" fill="#868e96">Source: IRS Instructions for Form 5472 (12/2024), IRC Sections 6038A, 6038C</text>
</svg>
